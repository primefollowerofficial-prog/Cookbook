<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>My eBook</title>
<link rel="stylesheet" href="book.css">
</head>
<body>

<div id="stage">
    <div id="zoomWrapper">
        <div id="book"></div>
    </div>
</div>

<div id="controls">
    <div class="btn-row">
        <button id="prevBtn">◀ Previous</button>
        <button id="nextBtn">Next ▶</button>
    </div>
    <a id="downloadBtn" href="https://drive.google.com/uc?export=download&id=1E_qgi1a9Bmg0KqpbXCACMlk9JAV6GbDr" target="_blank" rel="noopener">
        <span class="dl-icon">⬇</span> Download PDF
    </a>
    <div id="pageNum"></div>
</div>

<!-- Fullscreen image viewer (opened by clicking a page) -->
<div id="imgViewer">
    <button id="viewerClose">✕</button>
    <button id="viewerPrev">‹</button>
    <img id="viewerImg" src="" alt="">
    <button id="viewerNext">›</button>
</div>

<!-- Single script: page-flip engine + all custom logic, no CDN required -->
<script src="new.js"></script>
<script>
    window.addEventListener('load', () => {
        if (typeof St === 'undefined') {
            console.error('❌ page-flip engine did not initialize. Check new.js for errors.');
        } else {
            console.log('✅ page-flip engine loaded fine.');
        }
    });
</script>

</body>
</html>
